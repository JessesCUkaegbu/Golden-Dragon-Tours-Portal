{% extends 'base_auth.html' %}
{% block content %}
<div class="auth-wrapper">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="auth-card shadow-lg text-center">
        <div class="auth-header">
          <span class="auth-badge">Check Your Inbox</span>
          <h2>Reset Link Sent</h2>
          <p>If an account with that email exists, we've sent a password reset link. Check your inbox and spam folder.</p>
        </div>
        <a href="{% url 'login' %}" class="btn btn-brand w-100 py-3 mt-4">Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
