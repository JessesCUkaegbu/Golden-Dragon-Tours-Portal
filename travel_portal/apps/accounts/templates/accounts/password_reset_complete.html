{% extends 'base_auth.html' %}
{% block content %}
<div class="auth-wrapper">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="auth-card shadow-lg text-center">
        <div class="auth-header">
          <span class="auth-badge">All Done</span>
          <h2>Password Reset Complete</h2>
          <p>Your password has been set. You can now log in with your new password.</p>
        </div>
        <a href="{% url 'login' %}" class="btn btn-brand w-100 py-3 mt-4">Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
