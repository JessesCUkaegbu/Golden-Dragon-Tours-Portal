{% extends 'base_auth.html' %}
{% block content %}
<div class="auth-wrapper">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="auth-card shadow-lg">
        <div class="auth-header text-center">
          <span class="auth-badge">Account Recovery</span>
          <h2>Reset Your Password</h2>
          <p>Enter your email and we'll send you a link to reset your password.</p>
        </div>
        <form method="POST" class="auth-form mt-4">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control custom-input" placeholder="Enter your email address" required />
          </div>
          <button type="submit" class="btn btn-brand w-100 py-3 mt-2">Send Reset Link</button>
        </form>
        <div class="text-center mt-4">
          <small><a href="{% url 'login' %}" class="auth-link">← Back to Login</a></small>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
