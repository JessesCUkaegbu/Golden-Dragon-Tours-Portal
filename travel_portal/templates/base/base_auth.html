{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tixora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'portal/css/style.css' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">
  <div class="auth-topbar">
    <a href="{% url 'home' %}" class="auth-topbar-logo">
      <img src="{% static 'portal/image/logo.jpg' %}" alt="Tixora" height="36" onerror="this.style.display='none'" />
      <span>Tixora</span>
    </a>
    <a href="{% url 'home' %}" class="auth-topbar-back">← Back to Home</a>
  </div>
  <main class="auth-page-wrapper">{% block content %}{% endblock %}</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'portal/js/app.js' %}"></script>
</body>
</html>
