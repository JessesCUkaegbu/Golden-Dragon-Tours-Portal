{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golden Dragon Tours</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'portal/css/style.css' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="auth-body">
    <!-- Minimal auth header — logo only, no navbar -->
    <div class="auth-topbar">
      <a href="{% url 'home' %}" class="auth-topbar-logo">
        <img
          src="{% static 'portal/image/logo.png' %}"
          alt="Golden Dragon Tours"
          height="36"
          onerror="this.style.display = 'none'"
        />
        <span>Golden Dragon Tours</span>
      </a>
      <a href="{% url 'home' %}" class="auth-topbar-back"> ← Back to Home </a>
    </div>

    <!-- No flash messages here — auth pages handle their own errors inline -->
    <main class="auth-page-wrapper">{% block content %}{% endblock %}</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'portal/js/app.js' %}"></script>
  </body>
</html>
